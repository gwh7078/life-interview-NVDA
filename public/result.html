<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f6f1">
    <title>人生采访局 · 故事更新</title>
    <link rel="stylesheet" href="/ui.css">
    <link rel="stylesheet" href="/result.css">
    <script defer src="/result.js"></script>
  </head>
  <body>
    <main class="page-shell result-shell">
      <header class="site-header">
        <a class="brand" href="/my-life" aria-label="回到我的人生">
          <span class="brand-mark" aria-hidden="true">人</span>
          <span class="brand-copy"><span class="eyebrow">LIFE INTERVIEW</span><span class="brand-name">人生采访局</span></span>
        </a>
        <a class="button button-quiet" href="/my-life">我的人生</a>
      </header>

      <section class="status-card" aria-labelledby="status-title">
        <div class="status-indicator" id="status-indicator" data-state="loading" aria-hidden="true"></div>
        <div class="status-copy" role="status" aria-live="polite" aria-atomic="true">
          <p class="section-label">刚刚聊完</p>
          <h1 id="status-title">正在读取这次聊天…</h1>
          <p id="status-description">我们会把刚才的内容整理好，新的故事会出现在你的人生时间线里。</p>
          <p id="processing-stage" class="processing-stage" hidden>
            <span id="processing-stage-text">正在理解本轮访谈</span>
            <span class="processing-dots" aria-hidden="true"><span>·</span><span>·</span><span>·</span></span>
          </p>
        </div>
        <span class="session-id debug-only" id="session-id"></span>
      </section>

      <div id="processing-notice" class="notice processing-notice" role="status" aria-live="polite" hidden>
        <span class="processing-notice-mark" aria-hidden="true">✦</span>
        <p>你可以先离开此页面，整理会继续进行，完成后会自动写入故事。</p>
      </div>

      <div id="page-error" class="notice notice-error" role="alert" hidden></div>
      <div id="empty-notice" class="notice" hidden>
        <h2>还没有可显示的访谈结果</h2>
        <p>请回到我的人生，稍后再查看这次聊天。</p>
      </div>

      <div id="result-content" hidden>
        <section class="panel summary-panel" aria-labelledby="summary-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">故事更新</p>
              <h2 id="summary-title">这次聊到了</h2>
            </div>
          </div>
          <div class="story-heading" id="story-heading" hidden>
            <h3 id="story-title"></h3>
          </div>
          <p id="story-summary" class="summary-text empty-copy">故事摘要正在整理。</p>
        </section>

        <section class="panel new-stories-panel" aria-labelledby="new-stories-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">新的线索</p>
              <h2 id="new-stories-title">本次新建的故事</h2>
            </div>
          </div>
          <div id="new-stories-list" class="new-story-list"></div>
        </section>

        <section class="panel debug-only" aria-labelledby="transcript-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">完整记录</p>
              <h2 id="transcript-title">访谈 Transcript</h2>
            </div>
            <span class="count-label" id="transcript-count"></span>
          </div>
          <div id="transcript-list" class="transcript-list"></div>
        </section>

        <section class="panel model-metadata-panel debug-only" id="model-metadata-block" hidden aria-labelledby="model-metadata-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">本次整理</p>
              <h2 id="model-metadata-title">模型信息</h2>
            </div>
          </div>
          <dl id="model-metadata-list" class="model-metadata-list"></dl>
        </section>
      </div>

      <div id="retry-panel" class="retry-panel" hidden>
        <p id="retry-message">整理暂时没有完成，访谈记录会保留，你可以安全重试。</p>
        <button id="retry-button" class="button button-primary" type="button">重新整理</button>
      </div>

      <footer class="page-footer result-footer">
        <span class="debug-only">结果 Session 仅供诊断</span>
        <button id="finish-button" class="button button-primary" type="button">回到我的人生</button>
      </footer>
    </main>
  </body>
</html>
