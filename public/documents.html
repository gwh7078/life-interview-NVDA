<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f6f1">
    <title>成稿与版本 · 人生采访局</title>
    <link rel="stylesheet" href="/documents.css">
    <script type="module" src="/documents.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="brand-mark" href="/my-life" aria-label="返回我的人生">人</a>
        <div class="header-copy">
          <p class="eyebrow">STORY DOCUMENTS</p>
          <h1>成稿与版本</h1>
        </div>
        <nav class="header-links" aria-label="页面导航">
          <a id="story-link" href="./">返回故事</a>
        </nav>
        <div class="profile-wrap" hidden>
          <button id="profile-entry" class="profile-entry" type="button" aria-label="个人资料入口" aria-expanded="false" aria-controls="profile-popover">
            <span class="profile-avatar" id="profile-avatar" aria-hidden="true">人</span>
            <span class="profile-name" id="profile-name">我的档案</span>
            <span aria-hidden="true">⌄</span>
          </button>
          <div class="profile-popover" id="profile-popover" hidden>
            <strong id="profile-popover-name">我的档案</strong>
            <p>个人资料详情暂未开放</p>
            <a href="/interview">返回采访</a>
          </div>
        </div>
      </header>

      <section class="login-notice panel" id="login-notice" hidden aria-labelledby="login-title">
        <div class="empty-emblem" aria-hidden="true">人</div>
        <h2 id="login-title">登录后查看成稿</h2>
        <p>登录后可以查看故事成稿和历史版本。</p>
        <a class="button button-primary" id="login-link" href="/interview">前往登录</a>
      </section>

      <p class="page-notice" id="page-notice" role="alert" hidden></p>
      <div class="page-retry" id="page-retry" hidden>
        <button class="button button-secondary" type="button" id="retry-button">重新加载</button>
      </div>
      <p class="loading-state" id="loading-state" role="status">正在读取成稿版本…</p>

      <section class="documents-content" id="documents-content" hidden aria-labelledby="documents-heading">
        <section class="panel documents-heading-panel">
          <div class="documents-heading-copy">
            <p class="section-kicker">STORY DOCUMENTS</p>
            <h2 id="documents-heading">成稿与版本</h2>
            <p class="story-reference" id="story-reference"></p>
          </div>
          <button class="button button-primary" id="start-generation-button" type="button" hidden></button>
        </section>

        <section class="empty-state panel" id="empty-state" hidden aria-labelledby="empty-heading">
          <div class="empty-emblem" aria-hidden="true">文</div>
          <h3 id="empty-heading">还没有成稿</h3>
          <p id="empty-copy">这个故事已经可以整理成第一篇文章。</p>
          <button class="button button-primary" id="empty-generate-button" type="button">生成第一版</button>
          <p class="readiness-copy" id="not-ready-copy" hidden>继续完成访谈后，就可以生成第一版成稿。</p>
          <a class="button button-secondary" id="not-ready-continue-link" href="#" hidden>继续聊故事</a>
        </section>

        <p class="readiness-notice" id="revision-notice" hidden></p>
        <div class="version-list" id="version-list" aria-live="polite"></div>
      </section>

      <footer class="page-footer"><a id="footer-story-link" href="./">返回故事</a></footer>
    </main>

    <dialog class="generation-dialog" id="generation-dialog" aria-labelledby="generation-title">
      <form id="generation-form" class="generation-form">
        <header class="dialog-header">
          <div>
            <p class="section-kicker">STORY GENERATION</p>
            <h2 id="generation-title">润色成稿</h2>
          </div>
          <button class="icon-button" id="close-generation-button" type="button" aria-label="关闭生成窗口">×</button>
        </header>

        <p class="generation-context" id="generation-context"></p>
        <fieldset class="style-fieldset" aria-describedby="generation-context">
          <legend class="field-label" id="generation-style-label">文章风格</legend>
          <div class="style-options" role="radiogroup" aria-labelledby="generation-style-label">
            <label class="style-option" for="generation-style">
              <input id="generation-style" name="style" type="radio" value="documentary" checked>
              <span class="style-option-card">
                <strong>默认纪实</strong>
                <span>清晰、自然、忠于原始讲述</span>
              </span>
            </label>
            <label class="style-option" for="generation-style-warm">
              <input id="generation-style-warm" name="style" type="radio" value="warm">
              <span class="style-option-card">
                <strong>温暖叙事</strong>
                <span>更突出人物感受和情感温度</span>
              </span>
            </label>
            <label class="style-option" for="generation-style-restrained">
              <input id="generation-style-restrained" name="style" type="radio" value="restrained">
              <span class="style-option-card">
                <strong>克制口述</strong>
                <span>接近本人讲述，少修饰</span>
              </span>
            </label>
            <label class="style-option" for="generation-style-literary">
              <input id="generation-style-literary" name="style" type="radio" value="literary">
              <span class="style-option-card">
                <strong>文学化</strong>
                <span>增加场景、节奏和文字表现力</span>
              </span>
            </label>
          </div>
        </fieldset>

        <label class="field-label" for="generation-instruction">还有什么要求？ <span class="optional-label">可选</span></label>
        <textarea class="text-field instruction-field" id="generation-instruction" name="user_instruction" rows="5" placeholder="例如：使用第一人称，保留当时的犹豫和情绪。"></textarea>
        <p class="generation-progress" id="generation-progress" role="status" aria-live="polite" hidden>正在整理成稿…</p>
        <p class="generation-feedback" id="generation-feedback" role="alert" hidden></p>

        <div class="dialog-actions">
          <button class="button button-secondary" id="cancel-generation-button" type="button">返回</button>
          <button class="button button-primary" id="submit-generation-button" type="submit">开始生成</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
