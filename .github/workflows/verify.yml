name: Verify

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/story-agent-memory'
      - 'nvidia/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck changed contracts first
        run: npm run typecheck

      - name: Run deterministic verification
        run: bash scripts/codex-verify.sh
