name: Verify

on:
  push:
    branches:
      - main
      - spark
      - 'codex/**'
      - 'feature/story-agent-memory'
      - 'nvidia/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.19
          enable-cache: true
          cache-dependency-glob: nvidia/nat/uv.lock

      - name: Install dependencies
        run: bash scripts/codex-node.sh npm ci

      - name: Validate Spark deployment scripts
        run: |
          bash -n deploy/spark/*.sh deploy/spark/agent/*.sh deploy/spark/services/*.sh
          python3 -m py_compile deploy/spark/services/*.py deploy/spark/fixtures/*.py
          bash scripts/codex-node.sh npm run test:spark:deployment

      - name: Run deterministic verification
        run: bash scripts/codex-verify.sh
