schema_version = "1.3"

[task]
name = "nvidia/skillevaluator-IC-007"
description = "Skill evaluation task for interview-closeout"

[metadata]
skill = "interview-closeout"
entry_id = "IC-007"
has_skill = false

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 600.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
